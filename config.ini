# Configuration file for Pose Detection System
# Edit nilai di sini untuk menyesuaikan sensitivitas deteksi

[DETECTION_THRESHOLDS]
# Jarak minimum tangan ke wajah untuk Thinking Pose (0.0 - 1.0)
thinking_pose_distance = 0.15

# Sudut minimum lengan untuk Pointing Up Pose (degrees)
pointing_pose_angle = 140

# Toleransi perbedaan tinggi bahu untuk Relaxed Pose (0.0 - 1.0)
relaxed_pose_shoulder_diff = 0.05

# Toleransi perbedaan tinggi pinggul untuk Relaxed Pose (0.0 - 1.0)
relaxed_pose_hip_diff = 0.05

[MEDIAPIPE_SETTINGS]
# Confidence threshold untuk deteksi pose (0.0 - 1.0)
min_detection_confidence = 0.5

# Confidence threshold untuk tracking pose (0.0 - 1.0)
min_tracking_confidence = 0.5

# Mode static image (true/false)
static_image_mode = false

# Model complexity (0=Lite, 1=Full, 2=Heavy)
model_complexity = 1

[CAMERA_SETTINGS]
# Index kamera (0=default, 1=external, etc.)
camera_index = 0

# Lebar frame
frame_width = 1280

# Tinggi frame
frame_height = 720

# FPS target
target_fps = 30

[DISPLAY_SETTINGS]
# Ukuran font untuk text overlay
font_scale = 1.0

# Ketebalan font
font_thickness = 2

# Warna landmark (BGR format)
landmark_color_primary = 0,255,0

# Warna connection (BGR format)
landmark_color_secondary = 0,0,255

# Ketebalan landmark
landmark_thickness = 2

# Radius landmark circle
landmark_circle_radius = 2

[SCREENSHOT_SETTINGS]
# Format file screenshot
screenshot_format = jpg

# Kualitas screenshot (1-100 untuk jpg)
screenshot_quality = 95

# Prefix nama file
screenshot_prefix = pose_screenshot_

[LOGGING]
# Enable logging (true/false)
enable_logging = true

# Log level (DEBUG, INFO, WARNING, ERROR)
log_level = INFO

# Log file path
log_file = pose_detection.log

[POSE_CUSTOMIZATION]
# Nama pose kustom (tambahkan sesuai kebutuhan)
# Format: pose_name = emoji, description

custom_pose_1 = 💪, Flexing Pose
custom_pose_2 = 🙏, Prayer Pose
custom_pose_3 = 🤸, Stretching Pose
